default_stages:
- pre-commit
repos:
- repo: local
  hooks:
  - id: ruff-check
    name: Lint Python code (Ruff)
    entry: uv run --no-sync ruff check
    language: system
    types:
    - python
    pass_filenames: true
  - id: ruff-format-check
    name: Check Python formatting (Ruff)
    entry: uv run --no-sync ruff format --check
    language: system
    types:
    - python
    pass_filenames: true
  - id: taplo-lint
    name: Lint TOML files (Taplo)
    entry: taplo lint
    language: system
    types:
    - toml
    pass_filenames: true
  - id: ty
    name: Type-check Python codebase (Ty)
    entry: uv run --no-sync python -m ty check src dev docs
    language: system
    types:
    - python
    pass_filenames: false
  - id: mdformat-check
    name: Check Markdown formatting (mdformat)
    entry: uv run --no-sync mdformat --check
    language: system
    pass_filenames: true
    types:
    - markdown
    exclude: '^CHANGELOG\.md$'
  - id: mdformat-wrap-docs-check
    name: Check wrapped user-facing Markdown (mdformat)
    entry: uv run --no-sync mdformat --wrap 88 --check
    language: system
    pass_filenames: true
    types:
    - markdown
    files: '^(README\.md|docs/.*\.md|src/vaultspec_core/builtins/.*\.md)$'
  - id: pymarkdown
    name: Lint Markdown style (pymarkdown)
    entry: uv run --no-sync pymarkdown --config .pymarkdown.json scan
    language: system
    pass_filenames: true
    types:
    - markdown
    exclude: '^CHANGELOG\.md$'
  - id: vault-fix
    name: Vault gate
    entry: uv run --no-sync vaultspec-core vault check all
    language: system
    types:
    - markdown
    pass_filenames: false
  - id: vault-sanitize-annotations
    name: Vault sanitize annotations
    entry: uv run --no-sync vaultspec-core vault sanitize annotations
    language: system
    types:
    - markdown
    pass_filenames: false
  - id: spec-check
    name: Vault Doctor (Check)
    entry: uv run --no-sync vaultspec-core spec doctor --gate-errors
    language: system
    types:
    - markdown
    pass_filenames: false
  - id: cli-reference-check
    name: CLI reference up to date (generator --check)
    entry: uv run --no-sync vaultspec-core spec reference generate --check
    language: system
    pass_filenames: false
    files: '^(src/vaultspec_core/cli/.*\.py|src/vaultspec_core/builtins/reference/cli\.md|docs/CLI\.md)$'
  - id: doc-cli-language
    name: Docs name the CLI entry point
    # The guard that reads only markdown, not the live CLI: 0.06s of work in
    # a 1.4s invocation. Its three expensive siblings in the same file shell
    # out to `--help` for every command and stay in CI, where 50s is free.
    #
    # This exists because the bare-reference guard was CI-only, so `vault
    # check` reached main in README.md on 2026-09-02 and sat there red for
    # two days. Selection is by marker rather than by test name: a renamed
    # test silently shrinks a `-k` expression, and pytest exits 5 - loudly -
    # when a marker selects nothing.
    entry: uv run --no-sync pytest dev/guards -m precommit -q
    language: system
    pass_filenames: false
    types:
    - markdown

  - id: check-provider-artifacts
    name: Check provider artifacts
    entry: uv run --no-sync vaultspec-core check-providers
    always_run: true
    language: system
    pass_filenames: false
  - id: block-manual-changelog
    name: Block manual CHANGELOG.md edits (release-please-managed)
    entry: python -c "import subprocess, sys; changed = subprocess.run(['git', 'diff', '--cached', '--name-only', '--', 'CHANGELOG.md'], capture_output=True, text=True, check=False).stdout.strip(); sys.exit('CHANGELOG.md is auto-managed by release-please. Do not edit manually - land your change as a conventional commit (feat:/fix:/perf:/...) and release-please will regenerate CHANGELOG.md on the next release PR.' if changed else 0)"
    language: system
    files: '^CHANGELOG\.md$'
    pass_filenames: false
