name: Core Release Please

# THE PROPOSAL KEEPS UP; MERGING IT STARTS THE RELEASE.
#
# - PROPOSAL. Every commit that lands on main refreshes the release pull
#   request. `always-update` in the config rebuilds its branch on main's newest
#   head every time, so the proposal is never behind main. Release Please
#   writes it as the fleet release App, so the pull request's own events run
#   the full merge gate like any trusted author's, and its required check
#   reports on the head that merges. The lockfile's version bump rides in
#   Release Please's own commit (`extra-files` in the config), so the proposal
#   is one head with one verdict. This path never creates a release, a tag or
#   a publication.
# - CUT. The push from merging a proposal starts the cut automatically. It
#   proves the merged commit with the full merge gate and
#   has Release Please force the tag and create the draft release seconds
#   later, then starts the binaries lane. The draft is published last, by the
#   publication lane, once everything it claims is attached.
#
# A manual dispatch retries the cut of a merged proposal that carries no tag.
# The proof comes before the tag because the release tag ruleset forbids
# deleting a tag: a release commit that fails its gate after its tag exists
# stays a permanent tag of a commit nobody can ship.
#
# Tagging follows proof immediately because the default token
# cannot create a tag on a commit whose `.github/workflows` differ from main's
# head. A workflow change that lands between a merge and its tag leaves the
# release untaggable by any later run.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Automatic cuts and manual retries must not tag the same proposal in parallel.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: "Build: Release proposal (Linux)"
    needs: candidate
    if: github.event_name == 'push' && !needs.candidate.outputs.sha
    timeout-minutes: 150
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    # The release pull request is written with the App's token; the workflow
    # token only reads the merged proposals.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A pull request the workflow token writes is authored by
      # github-actions[bot]: its merge-gate runs wait for an approval nothing
      # gives, and its required check never reports. The App is a trusted
      # author the merge gate runs for. There is no fallback to the workflow
      # token: without the App the proposal fails here rather than coming back
      # as a pull request that cannot merge.
      - name: Mint the release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only the cut job creates releases.
          skip-github-release: true

      # Release Please exits successfully when an untagged merged proposal
      # blocks it. Surface that state instead of a green run.
      - name: Reject a blocked release proposal
        if: ${{ !steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --state merged --label "autorelease: pending" --limit 100 \
            --json number --jq 'map(.number | tostring) | join(", ")')
          if [ -n "${pending}" ]; then
            echo "::error::Release Please is blocked by untagged merged release pull request(s): ${pending}. Dispatch Core Release Please to prove and cut the pending release before refreshing the proposal."
            exit 1
          fi

  candidate:
    name: "Check: Release candidate (Linux)"
    timeout-minutes: 130
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      # A merged proposal not yet tagged is finished first: Release Please
      # opens no new proposal while one is pending, so it is the only candidate
      # there can be. An open proposal is never a candidate; it merges like any
      # pull request, once its own merge gate has passed.
      - name: Find the release pull request and the commit to prove
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: "autorelease: pending"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --label "$PENDING" --json number,mergeCommit \
            --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          if [ -z "${merged}" ]; then
            if [ "${EVENT_NAME}" = "push" ]; then
              echo "No merged release is pending; refresh the proposal."
              exit 0
            fi
            echo "::error::no merged release pull request awaits a tag; merge the release pull request to start a release"
            exit 1
          fi
          [ "$(printf '%s\n' "${merged}" | wc -l)" -eq 1 ] || {
            echo "::error::more than one merged release pull request awaits a tag: ${merged}"; exit 1;
          }
          read -r number sha <<<"${merged}"
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release pull request #${number} resolved to no commit"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "cutting #${number} at ${sha}"

  # The full merge gate, on the exact commit that will be tagged.
  prove-gate:
    name: "Test: Release gate (Linux, Windows)"
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    uses: ./.github/workflows/merge-gate.yml
    permissions:
      contents: read
      checks: read
      pull-requests: write
    with:
      ref: ${{ needs.candidate.outputs.sha }}
    secrets:
      VAULTSPEC_CORE_TYPESAFE_API_KEY: ${{ secrets.VAULTSPEC_CORE_TYPESAFE_API_KEY }}

  # Reached only when the gate passed: a job's default condition is the success
  # of everything it needs, and a called workflow's result is its gate job's.
  cut:
    name: "Build: Release cut (Linux)"
    needs: [candidate, prove-gate]
    timeout-minutes: 130
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.candidate.outputs.sha }}
    # Creates the tag and draft with the workflow token, so no tag or release
    # event wakes another workflow, and dispatches the binaries lane.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Create the release for the merged proposal
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # GITHUB_TOKEN never holds the `workflows` permission, and without it
      # GitHub refuses any tag or release that targets a commit whose workflow
      # files differ from the branch head, even once the tag exists. When a
      # workflow change lands between a release commit's merge and its tag,
      # release-please fails "Resource not accessible by integration" on every
      # later run. The API error names neither the tag nor the cause, so this
      # step does.
      - name: Name a release this token cannot tag
        if: failure() && steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNBOOK: docs/README.md
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          tip=$(gh api "${repo}/commits/${GITHUB_REF_NAME}" --jq .sha)
          gh pr list --repo "${GITHUB_REPOSITORY}" --base "${GITHUB_REF_NAME}" \
            --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"' |
            while read -r number sha; do
              package=$(gh api "${repo}/contents/release-please-config.json?ref=${sha}" \
                --jq '.content | @base64d | fromjson | .packages["."]["package-name"]')
              version=$(gh api "${repo}/contents/.release-please-manifest.json?ref=${sha}" \
                --jq '.content | @base64d | fromjson | ."."')
              tag="${package}-v${version}"
              if gh api "${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                continue
              fi
              changed=$(gh api "${repo}/compare/${sha}...${tip}" \
                --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | join(", ")')
              if [ -n "${changed}" ]; then
                echo "::error::${tag} cannot be created by this job: #${number} merged it at ${sha}, and ${GITHUB_REF_NAME} has since changed ${changed}. Rerunning cannot finish it; release it with maintainer credentials as ${RUNBOOK} describes."
              fi
            done

      # The draft creates no tag of its own; `force-tag-creation` does, and the
      # whole lane builds from it. Refuse a tag on anything but the proven commit.
      - name: Require the tag on the proven commit
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${CREATED}" != "true" ] || [ -z "${TAG}" ]; then
            echo "::error::Release Please created no release for ${SHA}"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG}")
          tagged=$(awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${tagged}" ] || tagged=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if [ "${tagged}" != "${SHA}" ]; then
            echo "::error::${TAG} points at ${tagged}, not the proven ${SHA}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"

      # ONE consumer. The binaries lane attaches every declared target to the
      # draft and, from the gate that judges them complete, dispatches the
      # publication, which flips the draft last.
      #
      # `ref=main`, NOT `ref=${TAG}`: the dispatch ref resolves the WORKFLOW -
      # the matrix and release policy stay current - while the lane checks out
      # the tag for the SOURCE. vaultspec-core-v0.1.66 is why: dispatched at its
      # tag, it built the macos-x86_64 leg #372 had just removed, and the tap
      # moved onto a binary that cannot start.
      - name: Dispatch the binaries lane
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run binaries.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "tag=${TAG}"

  result:
    name: "Check: Release workflow result (Linux)"
    needs: [candidate, release-please, prove-gate, cut]
    if: ${{ !cancelled() }}
    timeout-minutes: 130
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
    steps:
      - name: Require every job on the selected path to succeed
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          PROPOSAL_RESULT: ${{ needs.release-please.result }}
          GATE_RESULT: ${{ needs.prove-gate.result }}
          CUT_RESULT: ${{ needs.cut.result }}
        run: |
          set -euo pipefail
          if [ "${CANDIDATE_RESULT}" != "success" ]; then
            echo "::error::Release candidate selection ${CANDIDATE_RESULT}"
            exit 1
          fi
          if [ -n "${RELEASE_SHA}" ]; then
            if [ "${GATE_RESULT}" != "success" ] || [ "${CUT_RESULT}" != "success" ]; then
              echo "::error::Release failed: gate=${GATE_RESULT}, cut=${CUT_RESULT}"
              exit 1
            fi
          elif [ "${PROPOSAL_RESULT}" != "success" ]; then
            echo "::error::Release proposal ${PROPOSAL_RESULT}"
            exit 1
          fi
