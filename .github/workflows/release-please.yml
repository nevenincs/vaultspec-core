name: Core Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 30
    name: "Build: Release proposal (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6  # zizmor: ignore[artipacked] pushes the lockfile and surface commits to the release branch
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv for the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # A release lane must not restore a cache any branch could have written.
          enable-cache: false

      # `just`, and `just init` below, because the snapshot refresh runs the
      # project's own verbs rather than uv alone: `spec reference generate`
      # shells out to the same `mdformat` the pre-commit hooks run, so that the
      # committed artifact and fresh output can never disagree on whitespace.
      # `just init` is this repository's one provisioning entry point, and a
      # second guess at what a job needs is the drift `merge-gate.yml` is guarded
      # against.
      - name: Set up just for the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Regenerate and push uv.lock onto the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push
          fi

      # THE ONLY PLACE THE SURFACE SNAPSHOT MAY MOVE, and the reason is the
      # same one that puts the lockfile refresh above here: on this branch the
      # version is already the candidate's and the tree is already the one
      # about to be tagged, so what is captured is exactly what will publish.
      #
      # On main the two versions are equal - release-please holds the bump
      # until this pull request merges - so `spec reference snapshot` refuses
      # to write there, and the generated references keep attributing against
      # the release that actually shipped. Running it anywhere else would
      # restamp unreleased commands as published.
      #
      # `generate` follows because the unreleased-surface regions are rendered
      # against the snapshot: moving one without the other leaves documents
      # quoting the release they no longer describe. Both are idempotent and
      # the whole step is a no-op when nothing changed, which matters on a
      # branch release-please regenerates and force-pushes.
      - name: Refresh the surface snapshot and generated references
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          just init
          just framework-surface
          if git diff --quiet; then
            echo "the published surface and its references are already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: record the published surface for release"
            git push
          fi

      # The push above lands a few seconds after release-please makes the pull
      # request mergeable, so a release merged inside that window ships the
      # previous version's lockfile and leaves main failing every job at
      # dependency install. Main is ruleset-protected and cannot be pushed to
      # directly, so reconcile through a pull request instead of assuming the
      # window was never hit.
      - name: Check out main to verify the released lockfile
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6  # zizmor: ignore[artipacked] pushes the reconciling lockfile branch
        with:
          ref: main

      - name: Set up uv for the lockfile verification
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # A release lane must not restore a cache any branch could have written.
          enable-cache: false

      - name: Open a reconciling pull request when the lockfile drifted
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if uv lock --locked; then
            echo "uv.lock on main matches the released version"
            exit 0
          fi
          echo "::warning::uv.lock on main did not match the released version; opening a reconciling pull request"
          uv lock
          BRANCH="chore/reconcile-uv-lock-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add uv.lock
          git commit -m "chore(deps): reconcile uv.lock with ${TAG}"
          git push --set-upstream origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "chore(deps): reconcile uv.lock with ${TAG}" \
            --body "The release for \`${TAG}\` was merged before the lockfile update reached its branch, so main carries the previous version's \`uv.lock\`. Every job installing with \`--locked\` fails until this merges."
          echo "Opened a lockfile reconciliation pull request for ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # The default token's pushes and pull requests start no workflow runs,
      # so the release pull request would never report the required merge
      # gate. A dispatch is exempt from that rule, and its check run lands on
      # the branch head the pull request is waiting on. Last, so it validates
      # the lockfile and surface commits pushed above.
      - name: Dispatch the merge gate for the release pull request
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Guarded, because a step's `env` is prepared before its `if` is
          # weighed: on the run that CREATES the release there is no pull
          # request, `pr` is empty, and a bare `fromJSON('')` fails the step
          # that the condition was about to skip. That failure then skipped
          # the release dispatch below, and v0.2.2 was tagged with nothing
          # built or published behind it.
          HEAD_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: gh workflow run merge-gate.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_BRANCH}" -f "ref=${HEAD_BRANCH}"

      # ONE consumer. release.yml proves the tagged tree with the full merge
      # gate and only then dispatches the PyPI publication and the binary
      # build, so nothing is published from a tree that has not passed.
      #
      # `ref=main`, NOT `ref=${TAG}`: the dispatch ref resolves the WORKFLOW -
      # the matrix and release policy stay current - while release.yml and
      # everything it dispatches check out the tag for the SOURCE.
      # vaultspec-core-v0.1.66 is why: dispatched at its tag, it built the
      # macos-x86_64 leg #372 had just removed, and the tap moved onto a binary
      # that cannot start.
      - name: Dispatch the release workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "tag=${TAG}"
