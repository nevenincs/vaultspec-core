name: Core Publish

on:
  # release-please is the single release authority. It dispatches this workflow
  # with the immutable tag after creating the release; retaining a tag-push
  # trigger would race a second publication of the same bytes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-core-v0.1.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # KEYED BY TAG. An unkeyed group means GitHub holds one running and one
  # pending run, so a third release silently CANCELS the queued one - and a
  # cancelled run reports `cancelled`, not `failed`. This repo cut five
  # releases in five hours on 2026-08-30. binaries.yml already keys its group
  # this way.
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 210
    name: "Build: Distribution (Linux)"
    # On the fleet, like every job in this repository.
    #
    # The distribution is a py3-none-any wheel, so the build host cannot affect
    # the artifact - but availability still matters, and this is the path that
    # let 0.1.58 and 0.1.59 tag while PyPI stayed on 0.1.57. The Linux/X64
    # runner is on the workstation, which is NOT power-gated, so publishing no
    # longer waits on a laptop being plugged in; it does now wait on that one
    # machine being up and free.
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Verify bundled builtins present
        run: |
          if [ ! -d "src/vaultspec_core/builtins/templates" ]; then
            echo "::error::src/vaultspec_core/builtins/ is missing canonical content - wheel build will fail"
            exit 1
          fi

      - name: Build package
        run: just build-python

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    timeout-minutes: 165
    name: "Test: Distribution smoke (Linux)"
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python
        run: uv python install 3.13

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl dev/smoke/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz dev/smoke/smoke_check.py

      # The tree the wheel was built from, provisioned so it can report its own
      # surface for the comparison below. After the two smoke tests, which ask
      # the distribution alone and must not see a project environment.
      - name: Initialize the worktree
        run: just init

      # ASKED OF THE DISTRIBUTION, NOT OF THE SOURCE. The wheel is installed in
      # isolation and reports the commands, flags and MCP tools it actually
      # exposes; the tagged tree reports its own; they must be identical. A
      # build that dropped or grew a command would otherwise ship a reference
      # describing a different program.
      #
      # It fails HERE - before `publish-pypi`, which is the one step that
      # cannot be undone.
      - name: Verify the distribution exposes the surface of its tree
        run: just release-verify-surface dist

  publish-pypi:
    timeout-minutes: 150
    name: "Build: PyPI publication (Linux)"
    needs: smoke-test
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    environment:
      name: pypi
    permissions:
      # `id-token: write` is for PyPI trusted publishing. `contents: WRITE`,
      # not read, because this job also uploads the wheel and sdist to the
      # GitHub Release - and an asset upload is a write to the repository.
      #
      # Declared `contents: read`, the upload fails with
      #   HTTP 403: Resource not accessible by integration
      # naming an uploads.github.com URL, which reads like a credential problem
      # with PyPI rather than a permission this workflow declines to ask for.
      # v0.1.64 published to PyPI and then failed here, so the distribution
      # reached the index and never reached the release it belongs to.
      id-token: write
      contents: write
      # For the attestation below. `id-token` is already present for PyPI
      # trusted publishing and is reused rather than re-justified; this is the
      # permission that lets the run publish the resulting bundle.
      attestations: write
      # Dispatching the acquisition check is a write to the Actions API. It
      # moved here from the binaries lane with the publication it has to follow:
      # acquisition acquires unauthenticated, so it cannot see a draft.
      actions: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      # ATTESTED BEFORE `uv publish`, because that is the one act in this
      # workflow that cannot be undone. A version pushed to PyPI cannot be
      # unpublished, so an attestation failure afterwards leaves the index
      # holding a distribution the GitHub Release has no wheel, no sdist and no
      # digests for - the v0.1.64 shape the permissions note above was written
      # about. Nothing here needs PyPI: `dist/` is byte-identical either side of
      # the upload, so the ordering costs nothing and buys the guarantee
      # binaries.yml states for its own lane.
      #
      # At this point `dist/` holds exactly the wheel and the sdist -
      # `Generate checksums` has not yet written SHA256SUMS into it - so the
      # subject set needs no exclusion and cannot acquire one by accident. The
      # `! -name SHA256SUMS` predicate below is therefore redundant here, and is
      # kept only so both lanes read identically; a reader comparing them should
      # not have to work out whether the difference is meaningful.
      #
      # SHA256SUMS is deliberately never a subject, in either lane. Both
      # workflows attach it to the same release on the same tag and merge into
      # it, and neither knows which runs last - the merge logic below exists
      # because of that race. An attestation over a file rewritten after it is
      # minted cannot be verified by the user it was minted for.
      - name: Enumerate the distribution to attest
        id: subjects
        run: |
          set -euo pipefail
          mapfile -t subjects < <(
            find dist -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort
          )
          # A build that produced no distribution must not attest nothing and
          # report success.
          if [ ${#subjects[@]} -eq 0 ]; then
            echo "::error::dist holds no attestable file; there is nothing to attest"
            exit 1
          fi
          echo "attesting ${#subjects[@]} file(s): ${subjects[*]}"
          {
            echo "count=${#subjects[@]}"
            echo "paths<<SUBJECTS_EOF"
            printf '%s\n' "${subjects[@]}"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          # MERGE rather than replace. binaries.yml publishes a SHA256SUMS to
          # this same release, and neither workflow knows which runs first -
          # vaultspec-rag v0.4.11 lost its wheel and sdist digests exactly this
          # way, leaving assets on a release with nothing to verify them
          # against. Entries for the files this run publishes are dropped from
          # the inherited copy first, so a re-run replaces its own lines rather
          # than duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

      - name: Ensure the GitHub Release exists
        # release-please creates it, as a draft, before dispatching the lane
        # that dispatches this workflow. Keep this idempotent guard for repair
        # dispatches: --verify-tag refuses to invent a release for an unpushed
        # tag, while "already exists" is the no-op we want.
        #
        # `--draft`, so that a release recreated here starts in the same state
        # release-please would have left it in. Publication is the last step of
        # this job and nothing else in the lane flips it, so a non-draft
        # recreation would publish an empty release at the moment it is made.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" --repo "$GITHUB_REPOSITORY"             --draft --verify-tag --generate-notes || true

      - name: Attach the distribution to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "${TAG}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # The instrument, immediately after the upload it speaks for. The attest
      # step can only report that the action exited zero; this asks the API the
      # question a user asks, and it is the reason the claim in the published
      # documentation is now true rather than aspirational.
      - name: Verify the attached distribution carries provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SUBJECTS: ${{ steps.subjects.outputs.paths }}
          EXPECTED: ${{ steps.subjects.outputs.count }}
        run: |
          set -euo pipefail
          unverified=()
          checked=0
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            checked=$((checked + 1))
            # Pinned to the signer workflow, not merely the repository, and
            # stderr kept so a Sigstore or API outage is distinguishable from a
            # missing attestation.
            # `< /dev/null` because this loop's stdin is the subject list.
            if ! why=$(gh attestation verify "${asset}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
              < /dev/null 2>&1); then
              unverified+=("$(basename "${asset}")")
              echo "::warning::${asset} did not verify:"
              printf '%s\n' "${why}" >&2
            fi
          done <<< "${SUBJECTS}"
          if [ "${checked}" -eq 0 ]; then
            echo "::error::no distribution file was checked for provenance; this guard cannot pass vacuously"
            exit 1
          fi
          if [ "${checked}" -ne "${EXPECTED}" ]; then
            echo "::error::verified ${checked} file(s) but ${EXPECTED} were attested; the subject list changed mid-job"
            exit 1
          fi
          if [ ${#unverified[@]} -ne 0 ]; then
            echo "::error::attached but unattested: ${unverified[*]}"
            exit 1
          fi
          echo "all ${checked} distribution file(s) verify against ${GITHUB_REPOSITORY}"

      # The artifact a user downloads, read back rather than assumed to be the
      # one the smoke-test job proved. Byte-identical is the whole question, and
      # a byte comparison answers it without running project code: this job
      # holds `id-token: write`, and it has no checkout of its own to run
      # project code from anyway.
      #
      # After the upload by necessity - there is nothing attached to check
      # before it - but before the publication, so a mismatch leaves an
      # unpublished draft rather than an advertised release.
      - name: Verify the attached wheel is the one this run built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/published"
          rm -rf "${published}"
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir "${published}"
          checked=0
          for built in dist/*.whl; do
            cmp "${built}" "${published}/$(basename "${built}")"
            checked=$((checked + 1))
          done
          if [ "${checked}" -ne 1 ]; then
            echo "::error::compared ${checked} wheel(s); exactly one is built and attached"
            exit 1
          fi
          echo "the attached wheel is byte-identical to the one this run built"

      # THE PUBLICATION. Everything above this line ran against a draft: the
      # binaries lane attached and proved every declared target, this job
      # attached the distribution, verified its provenance, and checked the
      # published wheel against the reference it ships. The release becomes
      # visible here and not before, so a release that exists is a release
      # that is complete.
      #
      # LAST, and after PyPI deliberately. Both steps are one-way, and they
      # fail differently: an index that rejects the upload leaves an
      # unpublished draft and nothing advertised, which a re-dispatch repairs,
      # while a release published before PyPI would advertise a version the
      # index does not carry. The draft is the safe state, so it is the one
      # held longest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --draft=false

      # The package-manager pointers, now that there is something for them to
      # point at. A Scoop manifest and a Homebrew formula address assets by
      # release download URL, so they advertise the release rather than form
      # part of it, and the binaries lane used to push them while the release
      # was still a draft - sending `brew upgrade` at a URL that served
      # nothing until the step above ran.
      #
      # Its own lane rather than more steps here: this job holds
      # `id-token: write` for PyPI, that grant mints an OIDC token for any
      # audience a step names, and the channel deploy key has no business
      # beside it. channels.yml holds the key and nothing else.
      #
      # A failure there does not retract the release. It is published and
      # verified by this point; the pointers lag by one dispatch, and
      # re-dispatching channels.yml for the same tag repairs them.
      - name: Point the release channels at this release
        run: gh workflow run channels.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}

      # The record the generated references are measured against, taken from
      # this release now that it is the one GitHub reports as latest. It lands
      # on main by pull request, so it cannot run before the flip above: before
      # it, the latest release is still the previous one.
      #
      # A failure to dispatch leaves main's references measured against the
      # previous release, and the repository guard that compares the record
      # with the latest release turns red until surface.yml is run for it.
      - name: Record the published surface on main
        run: gh workflow run surface.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The acquisition check acquires the way a user does - unauthenticated
      # `curl` against the releases API - so it cannot see a draft and has to
      # be asked after the publication above, not before it.
      #
      # It must be asked: acquisition.yml starts only from this dispatch and its
      # weekly schedule, never from a tag or a release event, so without the
      # dispatch a new release would wait days for its first acquisition.
      #
      # A failure to dispatch does not fail the release: it is published and
      # verified by this point, and the weekly run still covers it. It warns
      # rather than passing silently.
      - name: Ask the acquisition check to try this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh workflow run acquisition.yml --repo "$GITHUB_REPOSITORY"                --ref main -f tag="$TAG"; then
            echo "dispatched the acquisition check for ${TAG}"
          else
            echo "::warning::could not dispatch the acquisition check for ${TAG}; its weekly run still covers this release"
          fi
