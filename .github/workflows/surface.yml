name: Core Published Surface

# The record the generated references are measured against, taken from the
# release a user can install and from nothing else.
#
# `published-surface.json` names a release and holds its command, flag and MCP
# tool surface. It used to be stamped on the release-please branch from the
# candidate's own version, which named that version as published the moment the
# release pull request merged - and a release that then stopped before
# publication left main's references naming a version nobody could install.
#
# So the record moves only here, only after publication, and only from the
# published artifact: collect verifies the latest release's wheel, then runs
# it in user, mount and pid namespaces of its own. Its home is an empty one, so
# the runner's credentials and every checkout are out of reach; it sees no
# process but its own; its environment carries no credential. No fleet host
# exposes a container runtime to a job, and namespaces are what they do allow.
# Only its JSON surface reaches the record job. main is ruleset-protected, so
# the result lands by pull request, written as the fleet release App: a trusted
# author whose pull request runs the merge gate on its own events, as the
# release pull request does.
#
# publish.yml dispatches this after it publishes. Dispatching it by hand is the
# repair when that dispatch failed, and it is a no-op when main already records
# the latest release. It takes no tag: the latest release is the only one it may
# record, so there is no input to get wrong.

on:
  workflow_dispatch:

permissions:
  contents: read

# One recording at a time. Two publications in quick succession must not have
# their pushes to the recording branch race; both read the same latest release
# by the time either runs, so the second is a no-op.
concurrency:
  group: published-surface
  cancel-in-progress: false

jobs:
  collect:
    name: "Build: Verified surface collection (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          prune-cache: false

      - name: Verify the release and collect its surface without credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/surface-data"
          uv run --isolated --no-project --python 3.13 python -m dev.packaging.published_surface emit --namespace > "${RUNNER_TEMP}/surface-data/surface.json"

      - name: Upload only the surface data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-surface
          path: ${{ runner.temp }}/surface-data/surface.json
          if-no-files-found: error
          retention-days: 1

  record:
    needs: collect
    timeout-minutes: 150
    name: "Build: Published surface record (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    # The recording branch and its pull request are written with the App's
    # token, minted only after the project code below has run, and never
    # handed to the project's environment.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # A lane that writes to main must not restore a cache any branch
          # could have written.
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Download the collected surface data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-surface
          path: ${{ runner.temp }}/surface-data

      - name: Record the latest published release's surface
        run: uv run --no-sync python -m dev.packaging.published_surface record --from-file "${RUNNER_TEMP}/surface-data/surface.json"

      # The workflow token's pull request would be authored by
      # github-actions[bot], whose merge-gate runs wait for an approval nothing
      # gives. No fallback to it.
      - name: Mint the release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Force-pushed: the branch is this workflow's alone, and an older
      # recording on it is superseded, not merged. The token reaches git for
      # the one push only, never the checkout's config.
      - name: Open a pull request recording the published surface
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "main already records the latest published release's surface"
            exit 0
          fi
          snapshot="src/vaultspec_core/builtins/reference/published-surface.json"
          version="$(uv run --isolated --no-project --python 3.13 python -I -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['version'])" "${snapshot}")"
          branch="chore/record-published-surface"
          title="chore: record the published surface of ${version}"
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot}" --jq .id)
          git checkout -B "${branch}"
          git add src/vaultspec_core/builtins/reference/published-surface.json src/vaultspec_core/builtins/reference/cli.md docs/CLI.md docs/MCP.md
          git -c user.name="${bot}" -c user.email="${bot_id}+${bot}@users.noreply.github.com" commit -m "${title}"
          basic=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic}" push --force origin "${branch}"
          body="GitHub now reports \`${version}\` as the latest published release. This records the surface its published wheel reports and re-renders the references measured against it. Until this merges, main's references are measured against an earlier release, and the repository guard comparing the two is red."
          if [ -z "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "${branch}" --title "${title}" --body "${body}"
          else
            gh pr edit "${branch}" --title "${title}" --body "${body}"
          fi
          echo "Recorded the published surface of ${version} on ${branch}" >> "$GITHUB_STEP_SUMMARY"
