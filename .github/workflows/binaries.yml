name: Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-core-v0.1.48)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary's minimum glibc is whatever its build machine happens
          # to offer, so this leg builds inside an image pinned at the floor
          # dev/binaries/build_pyapp.py declares rather than on the runner,
          # whose glibc moves whenever the host is upgraded. The builder
          # re-reads the floor off the artifact and fails the job if it is
          # exceeded, so the image and that declaration cannot drift apart
          # silently. Pinned by digest: the build environment is downloaded and
          # executed, so a mutable tag is not an acceptable input.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            container: ""
          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            container: ""
          # No self-hosted macOS x86_64 host exists; PyApp cross-builds it on
          # the Apple Silicon runner (the CPython distribution is selected from
          # the cargo target triple, and clang links both arches natively).
          - name: macos-x86_64
            runner: [self-hosted, macOS, ARM64]
            target: x86_64-apple-darwin
            container: ""
          # Linux ARM64 runs in a colima container on macbook neo, registered
          # as `macbook-neo-linux-arm-core` and provisioned by
          # ~/action-runners/containers/vaultspec-core-linux-arm/runner-entry.sh
          # on that host. It is enrolled in the host's two fleet scripts, which
          # is what makes it a fleet member rather than a stray runner:
          # runner-powergate.sh (AC-only policy) and runner-deploy-hooks.sh
          # (post-job disk hygiene).
          #
          # THE FLEET SERVES ONLY ON AC POWER. On battery the gate stops every
          # runner on this host once it is idle - it never kills a running job -
          # and GitHub queues new ones until AC returns. So a release dispatched
          # while the laptop is unplugged does not fail, it waits. That is true
          # of the macOS legs above as well; this leg is not special.
          #
          # NO linux-aarch64 LEG, and the gap is declared rather than silent.
          # This host cannot build one that meets the target's floor by either
          # route. It has no reachable docker daemon, so a pinned manylinux
          # image cannot start at all - the job dies in `Initialize containers`
          # before checkout. Building natively instead does start, and produces
          # an artifact requiring GLIBC_2.39 against a declared floor of 2.28,
          # measured from the sibling project's uncontainerised aarch64 build on
          # this same host. So the floor check rejects it eleven glibc releases
          # out, which is the guard working, not a way around this.
          #
          # `HOMEBREW_TARGETS` still names the target, so `generate.py` prints
          # `::warning::no Homebrew coverage for: aarch64-unknown-linux-gnu` on
          # every release and omits the platform from the formula, rather than
          # pinning an asset nothing built. The gap stays visible each release.
          #
          # Restore the leg the moment this label is served by a host that can
          # run the pinned image; the container line is the only thing missing.
    # Artifact builds run on the shared self-hosted fleet (hosted multiplatform
    # runners are cost-prohibitive); see publish.yml for the same constraint.
    runs-on: ${{ matrix.runner }}
    # Empty for every leg but the two Linux ones, which GitHub reads as
    # "no container".
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 -- \
            python dev/binaries/build_pyapp.py --tag "${TAG}" --target "${TARGET}" --outdir dist-bin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

      # A containerised leg runs as root, and its workspace is the SAME
      # directory the runner reuses for every other job on that machine. Left
      # alone it hands the next non-container job a tree it has no permission
      # to clean, and that job dies in `Checkout` on `unlink '.git/FETCH_HEAD'`
      # - which is how `Attach to release` failed after a release built fine.
      # `/__w` is created by the runner and keeps the runner's ownership, so it
      # is the reference for what the tree should look like on the way out.
      # Runs on failure too: a leg that dies mid-build poisons the tree just as
      # thoroughly as one that succeeds.
      - name: Return the workspace to the runner's user
        if: ${{ always() && matrix.container != '' }}
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE"

  release:
    name: Attach to release
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      # This repo, for the generator itself. No deploy key and no push: the
      # channel pointers no longer live here.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # The ORG-WIDE distribution repository, which is where Scoop manifests
      # and Homebrew formulae belong. `nevenincs/homebrew-tap` serves both
      # package managers for every product under the account, so a user taps or
      # bucket-adds ONCE, ever - not once per product.
      #
      # Publishing into the product repo instead, as this workflow used to,
      # costs two things its own README argues against: it multiplies that
      # one-time step by the number of products, and it commits to a public
      # product repo's default branch on every release. The odd-looking name is
      # the whole price of the arrangement - Homebrew's one-argument tap form
      # requires a `homebrew-` prefix, and Scoop constrains nothing, so one
      # repository satisfies both.
      - name: Checkout the distribution repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-bin/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist-bin
          # Per-asset .sha256 files are produced by build_pyapp.py; fold them
          # into one sha256sum-compatible manifest and drop the fragments.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # The generator raises on a CR, but SHA256SUMS is published as an
          # asset in its own right and consumed by `sha256sum -c` directly, so
          # it is verified here too - a CR lands inside an asset name and makes
          # that entry match nothing for anyone verifying a download by hand.
          if LC_ALL=C grep -q $'\r' SHA256SUMS; then
            echo "::error::SHA256SUMS contains a carriage return; a builder wrote CRLF"
            LC_ALL=C grep -n $'\r' SHA256SUMS >&2
            exit 1
          fi
          # Every uploaded asset must be described, and every described digest
          # must match the bytes about to be published. This is the only place
          # the manifest and the artifacts are both in hand.
          for asset in *; do
            [ "$asset" = "SHA256SUMS" ] && continue
            if ! awk -v a="$asset" '$2 == a { found = 1 } END { exit !found }' SHA256SUMS; then
              echo "::error::${asset} is being uploaded with no SHA256SUMS entry"
              exit 1
            fi
          done
          sha256sum -c SHA256SUMS
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist-bin/* --clobber

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of a
      # green run. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # --root is why this needed no generator change: the paths were
          # always parameterised (root/bucket/<product>.json,
          # root/Formula/<product>.rb) and only the workflow assumed they were
          # this repository's.
          uv run --no-project --python 3.13 --             python -m dev.packaging.generate               --tag "${TAG}"               --checksums dist-bin/SHA256SUMS               --root channels

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd channels

          # Stage only THIS product's two files. The distribution repo serves
          # every product under the account, so `git add -- bucket Formula`
          # would sweep up a sibling's pointer if two releases raced, and
          # publish it under this tag's commit message.
          git add -- bucket/vaultspec-core.json Formula/vaultspec-core.rb

          # Compare the INDEX against HEAD, not the worktree. `git diff` reports
          # only tracked paths, so on the first release into a channel - when
          # these files are new and nothing tracks them yet - it reports no
          # change and this step exits zero having published nothing. That is
          # not hypothetical here: the distribution repo currently holds two
          # .gitkeep files and nothing else, so the first run WILL be that case.
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi

          # Identity passed to this one commit rather than persisted. This
          # runner is self-hosted and its checkout is reused by later jobs, so a
          # `git config` identity outlives the run.
          git -c user.name="github-actions[bot]"               -c user.email="github-actions[bot]@users.noreply.github.com"               commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # Rebase-and-retry, and it matters more here than it did in-repo.
          # This branch is now shared by EVERY product under the account, so the
          # racing commit is no longer just an unrelated push to this repo - it
          # is a sibling product publishing its own pointer. Per-product staging
          # above means such a rebase never carries someone else's file, and the
          # generator's backward-bump refusal still stops a stale re-run from
          # clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
