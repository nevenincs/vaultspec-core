name: Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-core-v0.1.48)"
        required: true
        type: string
      allow_queue:
        description: "Build even if a leg's runner is offline (the job will queue, not fail)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Refuse to start a build whose runners cannot serve it.
  #
  # A job whose `runs-on` matches no ONLINE runner does not fail - it QUEUES,
  # and a queued job is not bounded by `timeout-minutes`, so nothing in this
  # file can rescue it. v0.1.57, v0.1.58 and v0.1.59 ran 19h53m, 24h00m03s and
  # 24h00m03s before failing, and all three shipped no binaries.
  #
  # Three of this matrix's five legs land on the one power-gated MacBook, which
  # serves runners only on AC. That is correct behaviour and this job does not
  # fight it - it just refuses to spend a day discovering it. Dispatch again
  # once the host is on AC, or set `allow_queue` to wait deliberately.
  #
  # Hosted, deliberately: a preflight that needs the fleet cannot report that
  # the fleet is down.
  preflight:
    name: Preflight runners
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix selector has an online runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_QUEUE: ${{ inputs.allow_queue }}
        run: |
          set -euo pipefail
          runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners"             --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv')
          [ -n "${runners}" ] || { echo "::error::no self-hosted runners are registered"; exit 1; }

          # The selectors this workflow's matrix actually requires. Kept as an
          # array rather than a here-doc so every line stays inside the YAML
          # block scalar's indentation.
          selectors=(
            "self-hosted,linux,x64,build"
            "self-hosted,windows,x64"
            "self-hosted,macos,arm64"
            "self-hosted,linux,arm64"
          )

          failed=0
          for want in "${selectors[@]}"; do
            online=0; registered=0
            while IFS=$'	' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in *",${part},"*) ;; *) missing=1; break ;; esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${ALLOW_QUEUE}" = "true" ]; then
              echo "::warning::[${want}] has no online runner; continuing because allow_queue is set."
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by no registered runner." >&2
              failed=1
            else
              echo "::error::[${want}] matches ${registered} runner(s), none online - usually the power-gated host on battery. Dispatch again on AC." >&2
              failed=1
            fi
          done

          [ "${failed}" -eq 0 ] || { echo "::error::preflight refused a build that would queue rather than run" >&2; exit 1; }

  build:
    needs: preflight
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary's minimum glibc is whatever its build machine happens
          # to offer, so this leg builds inside an image pinned at the floor
          # dev/binaries/build_pyapp.py declares rather than on the runner,
          # whose glibc moves whenever the host is upgraded. The builder
          # re-reads the floor off the artifact and fails the job if it is
          # exceeded, so the image and that declaration cannot drift apart
          # silently. Pinned by digest: the build environment is downloaded and
          # executed, so a mutable tag is not an acceptable input.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            container: ""
          - name: macos-aarch64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            container: ""
          # No self-hosted macOS x86_64 host exists; PyApp cross-builds it on
          # the Apple Silicon runner (the CPython distribution is selected from
          # the cargo target triple, and clang links both arches natively).
          - name: macos-x86_64
            runner: [self-hosted, macOS, ARM64]
            target: x86_64-apple-darwin
            container: ""
          # Linux ARM64 runs in a colima container on macbook neo, registered
          # as `macbook-neo-linux-arm-core` and provisioned by
          # ~/action-runners/containers/vaultspec-core-linux-arm/runner-entry.sh
          # on that host. It is enrolled in the host's two fleet scripts, which
          # is what makes it a fleet member rather than a stray runner:
          # runner-powergate.sh (AC-only policy) and runner-deploy-hooks.sh
          # (post-job disk hygiene).
          #
          # THE FLEET SERVES ONLY ON AC POWER. On battery the gate stops every
          # runner on this host once it is idle - it never kills a running job -
          # and GitHub queues new ones until AC returns. So a release dispatched
          # while the laptop is unplugged does not fail, it waits. That is true
          # of the macOS legs above as well; this leg is not special.
          #
          # Containerised for the same reason as the x86_64 leg: without a
          # pinned image this artifact inherits the colima guest's glibc, and
          # the floor check fails the job when an artifact requires more than
          # its target declares. Same baseline, aarch64 image, likewise pinned.
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:15ac47b9d4ff96443e73bd2165e26fa412c3044a962e96bc1593bd5798b1dc65
    # Artifact builds run on the shared self-hosted fleet (hosted multiplatform
    # runners are cost-prohibitive); see publish.yml for the same constraint.
    runs-on: ${{ matrix.runner }}
    # Empty for every leg but the two Linux ones, which GitHub reads as
    # "no container".
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 -- \
            python dev/binaries/build_pyapp.py --tag "${TAG}" --target "${TARGET}" --outdir dist-bin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Attach to release
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      # Check out main so the channel-pointer steps can regenerate and
      # commit the in-repo Scoop manifest and Homebrew formula after the
      # assets are attached. The SSH deploy
      # key authenticates the manifest push: main is protected by a ruleset
      # that requires status checks, and a deploy-key push is a bypass actor,
      # so the automated bump lands without a human-gated PR while every other
      # push stays gated.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          ssh-key: ${{ secrets.SCOOP_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-bin/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist-bin
          # Per-asset .sha256 files are produced by build_pyapp.py; fold them
          # into one sha256sum-compatible manifest and drop the fragments.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # The generator raises on a CR, but SHA256SUMS is published as an
          # asset in its own right and consumed by `sha256sum -c` directly, so
          # it is verified here too - a CR lands inside an asset name and makes
          # that entry match nothing for anyone verifying a download by hand.
          if LC_ALL=C grep -q $'\r' SHA256SUMS; then
            echo "::error::SHA256SUMS contains a carriage return; a builder wrote CRLF"
            LC_ALL=C grep -n $'\r' SHA256SUMS >&2
            exit 1
          fi
          # Every uploaded asset must be described, and every described digest
          # must match the bytes about to be published. This is the only place
          # the manifest and the artifacts are both in hand.
          for asset in *; do
            [ "$asset" = "SHA256SUMS" ] && continue
            if ! awk -v a="$asset" '$2 == a { found = 1 } END { exit !found }' SHA256SUMS; then
              echo "::error::${asset} is being uploaded with no SHA256SUMS entry"
              exit 1
            fi
          done
          sha256sum -c SHA256SUMS
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist-bin/* --clobber

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of a
      # green run. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 --             python -m dev.packaging.generate               --tag "${TAG}"               --checksums dist-bin/SHA256SUMS

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- bucket Formula
          git commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # This job runs after a long matrix build, so main may have advanced
          # meanwhile. Rebase-and-retry (bounded) so an unrelated commit does not
          # fail the push non-fast-forward; the backward-bump guard in the
          # generator still protects against clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
