name: Core Acquisition

# Everything else in this repository tests what is IN the tree. This tests what
# a user actually receives: it installs from the published release only, on a
# machine with no checkout, no warm cache and no toolchain, and asserts the
# tool then does its job rather than merely exiting zero.
#
# It cannot run before publication, so it runs after - and on a schedule,
# because the ways acquisition rots are not caused by any commit: a yanked
# release, a renamed asset, a distribution whose glibc is older than the floor
# the artifact was built against.

on:
  release:
    types: [published]
  schedule:
    # Weekly, off the hour: nothing here is urgent and the fleet is shared.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to acquire (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read

# The only workflow here that could overlap with itself and had no group.
#
# Three triggers reach it - a weekly cron, `release: published`, and dispatch -
# and a release published on a Monday morning can land on top of the cron. The
# macOS leg runs on the power-gated host, where a job does not fail when the
# host is asleep, it QUEUES; overlapping runs therefore stack on that host
# rather than racing and resolving.
#
# `cancel-in-progress: false` deliberately, matching binaries.yml: acquisition
# writes artifacts, and cancelling a run mid-write is worse than serialising.
concurrency:
  group: acquisition-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  acquire:
    timeout-minutes: 60
    name: "Test: Release acquisition (Linux ${{ matrix.arch }}, ${{ matrix.image }})"
    strategy:
      fail-fast: false
      matrix:
        # Distributions OLDER than the build host, because the Linux artifact
        # links against whatever glibc built it and the floor is only proven by
        # running somewhere that has less. The rows come in two bands: one AT
        # the declared floor, which is the only band that can fail when a
        # container pin stops working, and one above it in the range a user is
        # most likely to be running.
        #
        # BOTH Linux architectures, because a published bundle nobody executes
        # is an untested bundle. aarch64 was built, attached and shipped in
        # v0.1.71 while this matrix still fetched only the x86_64 file, so that
        # binary reached users having never been started anywhere. The coverage
        # guard in dev/guards is what stops this recurring silently.
        #
        # The arm64 legs run on the SAME hosted runner class that BUILDS that
        # target, so their availability is already proven by the build rather
        # than assumed here. Every image here publishes an arm64 variant, so
        # the older-libc property holds identically on each architecture.
        #
        # HOSTED for the same reason the build leg is, and not as an exception
        # to the migration below: these legs set `container:`, and the fleet's
        # ARM64 host cannot serve a container job while its `/home/runner` is a
        # named volume. See the note beside `linux-aarch64` in binaries.yml.
        include:
          # AT the declared floor, on both architectures. Nothing else here
          # tests 2.28 itself: the Debian and Ubuntu images below sit
          # comfortably above it, so they would keep passing if the floor
          # slipped a version or two. RHEL 8's glibc is 2.28 exactly, which
          # makes these the two legs that can actually fail when a container
          # pin in binaries.yml stops doing its job.
          #
          # Package manager differs, so the install command travels with the
          # row rather than being branched on inside the step.
          - image: almalinux:8
            setup: dnf install -y -q curl git
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - image: almalinux:8
            setup: dnf install -y -q curl git
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Above the floor and below the build host, which is the band a user
          # is most likely to be in. bookworm is 2.36, jammy is 2.35.
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install what acquisition itself needs
        run: |
          set -eux
          ${{ matrix.setup }}

      - name: Acquire the published binary
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eux
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
                  | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "${tag}" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          version="${tag#vaultspec-core-v}"
          archive="vaultspec-core-v${version}-${TARGET}.tar.gz"
          mkdir -p /opt/acq
          curl -fsSL -o "/opt/acq/${archive}" \
            "https://github.com/${REPO}/releases/download/${tag}/${archive}"
          mkdir -p /opt/acq/bundle
          tar -xzf "/opt/acq/${archive}" -C /opt/acq/bundle
          chmod +x /opt/acq/bundle/vaultspec-core

      # A COLD START, once, with no retry, and the retry's absence is the
      # assertion rather than a tidy-up.
      #
      # This step used to loop for ten minutes. The binary bootstrapped its
      # application from PyPI at first launch, so a freshly tagged release was
      # not resolvable until publish.yml had propagated to the CDN edge this
      # machine reads: v0.1.67 failed three legs of four on exactly that, and
      # the fourth passed only because it happened to be scheduled a minute
      # later. The loop waited that race out, and #386 established that
      # waiting on the binary itself was the only honest way to observe it.
      #
      # The binary now carries its application and its whole dependency
      # closure, so there is nothing left to propagate and nothing to wait
      # for. Keeping the loop would be worse than redundant: it would turn
      # "this artifact still reaches for the network" into a slow pass, and a
      # real failure into a ten-minute one whose message blames an index the
      # artifact no longer consults. A single cold start that must succeed is
      # now the stronger check, because the property being observed changed.
      #
      # The probe gets its OWN home so a warm cache left by an earlier job on
      # this machine cannot make a broken release look acquirable.
      - name: The published binary starts on a machine that has never run it
        run: |
          set -eu
          export HOME=/tmp/bootstrap-probe
          rm -rf "$HOME"; mkdir -p "$HOME"
          /opt/acq/bundle/vaultspec-core --version

      - name: Use it the way a new user would
        run: |
          set -eux
          # A user's machine has none of this job's state. Give the binary a
          # home of its own so a warm cache cannot make a broken acquisition
          # look like a working one.
          export HOME=/tmp/fresh-home
          rm -rf "$HOME" /tmp/proj
          mkdir -p "$HOME" /tmp/proj

          /opt/acq/bundle/vaultspec-core --version

          cd /tmp/proj
          git init -q
          git config user.email acquisition@example.invalid
          git config user.name "Acquisition Check"

          /opt/acq/bundle/vaultspec-core install

          # Behaviour, not exit codes: the install has to leave a vault behind,
          # and the tool has to be able to read back what it just wrote.
          [ -d .vault ] || { echo "::error::install exited zero but scaffolded no .vault/"; exit 1; }
          /opt/acq/bundle/vaultspec-core vault check all

      - name: Return the workspace to the runner's user
        if: always()
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE" || true

  acquire-macos:
    timeout-minutes: 60
    name: "Test: Release acquisition (macOS)"
    # NATIVE, no container - macOS runners cannot host one, and none is needed:
    # the point of a container on the Linux legs is to supply an OLDER libc than
    # the build host. macOS has no equivalent knob here; what this leg adds is
    # simply that the artifact is EXECUTED at all.
    #
    # This host is power-gated and serves runners only on AC, so this job can
    # queue. That is acceptable and deliberate: acquisition runs after
    # publication and gates nothing, so a wait costs nothing but time. It must
    # never be made a release gate for that reason.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Acquire the published binary
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eux
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
                  | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "${tag}" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          echo "TAG=${tag}" >> "$GITHUB_ENV"

          # A directory of this job's own, not the shared work tree: a reused
          # self-hosted checkout is exactly the warm state this check exists to
          # avoid, and macOS runners here are long-lived.
          acq="${RUNNER_TEMP}/acq"
          rm -rf "${acq}"; mkdir -p "${acq}"
          echo "ACQ=${acq}" >> "$GITHUB_ENV"
          version="${tag#vaultspec-core-v}"
          archive="vaultspec-core-v${version}-aarch64-apple-darwin.tar.gz"
          curl -fsSL -o "${acq}/${archive}" \
            "https://github.com/${REPO}/releases/download/${tag}/${archive}"
          mkdir -p "${acq}/bundle"
          tar -xzf "${acq}/${archive}" -C "${acq}/bundle"
          chmod +x "${acq}/bundle/vaultspec-core"
          mv "${acq}/bundle/vaultspec-core" "${acq}/vaultspec-core"

          # Gatekeeper quarantines a curl-downloaded executable. A user gets the
          # same treatment from a browser download and clears it the same way;
          # Homebrew clears it for them. Strip it so this leg tests the binary
          # rather than the quarantine attribute.
          xattr -d com.apple.quarantine "${acq}/vaultspec-core" 2>/dev/null || true

      # A COLD START, once, with no retry, and the retry's absence is the
      # assertion rather than a tidy-up.
      #
      # This step used to loop for ten minutes. The binary bootstrapped its
      # application from PyPI at first launch, so a freshly tagged release was
      # not resolvable until publish.yml had propagated to the CDN edge this
      # machine reads: v0.1.67 failed three legs of four on exactly that, and
      # the fourth passed only because it happened to be scheduled a minute
      # later. The loop waited that race out, and #386 established that
      # waiting on the binary itself was the only honest way to observe it.
      #
      # The binary now carries its application and its whole dependency
      # closure, so there is nothing left to propagate and nothing to wait
      # for. Keeping the loop would be worse than redundant: it would turn
      # "this artifact still reaches for the network" into a slow pass, and a
      # real failure into a ten-minute one whose message blames an index the
      # artifact no longer consults. A single cold start that must succeed is
      # now the stronger check, because the property being observed changed.
      #
      # The probe gets its OWN home so a warm cache left by an earlier job on
      # this machine cannot make a broken release look acquirable.
      - name: The published binary starts on a machine that has never run it
        run: |
          set -eu
          export HOME="${RUNNER_TEMP}/bootstrap-probe"
          rm -rf "$HOME"; mkdir -p "$HOME"
          "${ACQ}/vaultspec-core" --version

      - name: Use it the way a new user would
        run: |
          set -eux
          export HOME="${RUNNER_TEMP}/fresh-home"
          proj="${RUNNER_TEMP}/proj"
          rm -rf "$HOME" "${proj}"
          mkdir -p "$HOME" "${proj}"

          # THE ASSERTION THIS LEG EXISTS FOR. A macOS binary that cannot start
          # exits non-zero here and nowhere else in this repository - not in the
          # build, which only produced it, and not in the Linux legs above.
          # vaultspec-core-x86_64-apple-darwin shipped for several releases
          # exiting 1 on launch, and reached users through the tap, because
          # nothing ever ran it.
          "${ACQ}/vaultspec-core" --version

          cd "${proj}"
          git init -q
          git config user.email acquisition@example.invalid
          git config user.name "Acquisition Check"

          "${ACQ}/vaultspec-core" install

          # Behaviour, not exit codes.
          [ -d .vault ] || { echo "::error::install exited zero but scaffolded no .vault/"; exit 1; }
          "${ACQ}/vaultspec-core" vault check all

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/acq" "${RUNNER_TEMP}/fresh-home" "${RUNNER_TEMP}/proj" || true

  # THE DOCUMENTED macOS INSTALL PATH, which until now nothing ran.
  #
  # `acquire-macos` above downloads the tarball with curl and strips the
  # quarantine attribute, so it proves the BINARY starts. It cannot prove the
  # channel a user is told to use still works, and the two are not the same
  # claim: Homebrew 7.0 began refusing to load a formula from a non-official
  # tap, so `brew tap` followed by `brew install` - the sequence docs/channels.md
  # published - stopped installing anything while every check in this repository
  # stayed green. A correct check placed where it does not execute is this
  # repository's most common defect, and the install path having no check at all
  # is the same defect with the check missing rather than misplaced.
  #
  # This leg runs the published sequence verbatim on a machine that has had the
  # tap, the trust and the formula removed first. It gates nothing - acquisition
  # runs after publication - so a queue on the power-gated host costs only time.
  acquire-homebrew:
    timeout-minutes: 45
    name: "Test: Release acquisition (macOS, Homebrew)"
    # Same power-gated host as acquire-macos, and the same reasoning: this job
    # may queue rather than fail, which is acceptable for a check that gates
    # nothing.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # A PRIVATE Homebrew, cloned fresh into this job's temp directory, not
      # the host's own. The host prefix belongs to its interactive user, and
      # Homebrew is single-owner: the runner account cannot write that Cellar,
      # so `brew install` there printed "Cellar is not writable", found the
      # formula the owner had installed by hand, called it up to date and
      # exited 0. The leg reported a successful install of a release it never
      # fetched. A prefix, cache, log directory and trust store of this job's
      # own make the acquisition cold by construction rather than by teardown,
      # and leave the host's Homebrew untouched.
      #
      # The latest stable tag, not the default branch: a new user's installer
      # checks out the same tag. RUNNER_TEMP rather than /tmp, because Homebrew
      # refuses a prefix inside its own temporary directory.
      - name: Provision a private Homebrew
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eux
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
                  | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "${tag}" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          echo "EXPECTED_VERSION=${tag#vaultspec-core-v}" >> "$GITHUB_ENV"

          root="${RUNNER_TEMP}/brew"
          rm -rf "${root}"
          mkdir -p "${root}/config"
          brew_tag=$(git ls-remote --tags --refs https://github.com/Homebrew/brew \
                     | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sort -V | tail -1)
          [ -n "${brew_tag}" ] || { echo "::error::could not resolve a Homebrew release tag"; exit 1; }
          git -c advice.detachedHead=false clone -q --depth 1 --branch "${brew_tag}" \
            https://github.com/Homebrew/brew "${root}/prefix"

          echo "${root}/prefix/bin" >> "$GITHUB_PATH"
          {
            echo "BREW_ROOT=${root}"
            echo "XDG_CONFIG_HOME=${root}/config"
            echo "HOMEBREW_CACHE=${root}/cache"
            echo "HOMEBREW_LOGS=${root}/logs"
            echo "HOMEBREW_NO_AUTO_UPDATE=1"
            echo "HOMEBREW_NO_ANALYTICS=1"
            echo "HOMEBREW_NO_ENV_HINTS=1"
          } >> "$GITHUB_ENV"

      # VACUITY GUARD. Every assertion below is about what a machine with no
      # prior install and no prior grant does. The private prefix makes that
      # true by construction; this proves the job is actually using it, since
      # the host prefix is still on PATH behind it.
      #
      # `brew trust` writes to ${XDG_CONFIG_HOME}/homebrew/trust.json when
      # that is set, and the step above set it, so that is the file to read.
      - name: Confirm the acquisition starts cold
        run: |
          set -eu
          prefix=$(brew --prefix)
          [ "${prefix}" = "${BREW_ROOT}/prefix" ] || {
            echo "::error::brew resolved to ${prefix}, not the private prefix ${BREW_ROOT}/prefix"
            exit 1
          }
          if brew list --formula vaultspec-core >/dev/null 2>&1; then
            echo "::error::vaultspec-core is already installed in ${prefix}"
            exit 1
          fi
          trust="${XDG_CONFIG_HOME}/homebrew/trust.json"
          if [ -e "${trust}" ] && grep -q 'nevenincs/tap' "${trust}"; then
            echo "::error::a nevenincs/tap trust entry exists before install; this leg cannot conclude anything about a clean machine"
            cat "${trust}" >&2
            exit 1
          fi
          echo "confirmed: $(brew --version | head -1) at ${prefix}, nothing installed, no grant in ${trust}"

      # THE PUBLISHED COMMAND, verbatim from docs/channels.md, on a machine
      # with no grant. The tap-qualified name is load-bearing and not a
      # stylistic choice: Homebrew 7.0 refuses a formula from an explicitly
      # added tap, so `brew tap` followed by `brew install vaultspec-core` -
      # what that document used to publish - installs nothing. Installing by
      # the qualified name taps as it installs and is not refused.
      #
      # If this line and docs/channels.md ever disagree, one of them is wrong.
      #
      # The version is asserted, not inferred from the exit status: `brew
      # install` exits 0 when it finds any installed version it considers
      # current, which is how a stale formula once stood in for the release.
      - name: Install exactly the way the documentation says to
        run: |
          set -eu
          brew install nevenincs/tap/vaultspec-core
          installed=$(brew list --versions vaultspec-core | awk '{print $2}')
          [ "${installed}" = "${EXPECTED_VERSION}" ] || {
            echo "::error::brew installed vaultspec-core ${installed:-nothing}, but the release under test is ${EXPECTED_VERSION}"
            exit 1
          }
          echo "confirmed: vaultspec-core ${installed} installed"

      # WHY THE DOCUMENTED COMMAND IS QUALIFIED, asserted rather than trusted
      # to prose. Without this, the step above passes just as happily if
      # Homebrew stops refusing the bare name, and the document keeps warning
      # about a refusal that no longer happens.
      #
      # A WARNING, not a failure. That the documented install works is
      # fail-closed above; whether Homebrew still gates the bare name is a
      # statement about Homebrew, and it may relax it. If it does, this says so
      # - which is the signal that docs/channels.md now over-warns - without
      # failing a release that installs correctly.
      - name: The bare name is still refused, which is what the docs explain
        run: |
          set -eu
          brew uninstall --force vaultspec-core
          brew tap nevenincs/tap
          if brew install vaultspec-core > bare.log 2>&1; then
            echo "::warning::the bare formula name installed from an untapped-trust machine; Homebrew no longer gates it and docs/channels.md now over-warns"
          elif grep -q 'untrusted tap' bare.log; then
            echo "confirmed: Homebrew refuses the bare name, as documented"
          else
            echo "::error::the bare-name install failed for a reason that is not the trust gate:"
            cat bare.log >&2
            exit 1
          fi
          rm -f bare.log
          # Restore the state the remaining steps assert against: the
          # documented command, from the same clean grant as above.
          brew untap nevenincs/tap || true
          brew untrust --formula nevenincs/tap/vaultspec-core || true
          brew install nevenincs/tap/vaultspec-core

      # Placement, not just exit status. `bin.install` naming one executable and
      # shipping two is a formula bug that a passing `brew install` hides.
      - name: Both executables are on PATH where Homebrew put them
        run: |
          set -eu
          for command in vaultspec-core vaultspec-core-mcp; do
            resolved=$(command -v "${command}") || {
              echo "::error::${command} is not on PATH after brew install"
              exit 1
            }
            case "${resolved}" in
              "${BREW_ROOT}/prefix/"*) ;;
              *)
                echo "::error::${command} resolved to ${resolved}, outside the Homebrew prefix this job installed into"
                exit 1
                ;;
            esac
            echo "${command} -> ${resolved}"
          done

      # THE ASSERTION THIS LEG ADDS over acquire-macos: no attribute was
      # stripped to get here. `brew` fetches the archive itself rather than
      # through a browser, which is the whole reason docs/channels.md calls
      # Homebrew the supported macOS path. If a future formula acquired the
      # attribute - a `url` served in a way Gatekeeper tags, say - that claim
      # would be false and users would meet the dialog the documentation
      # promises they will not.
      #
      # com.apple.provenance is EXPECTED and is not quarantine: macOS 13+ tags
      # executables it has run. Only com.apple.quarantine gates launching.
      - name: Nothing Homebrew installed is quarantined
        run: |
          set -eu
          quarantined=0
          for command in vaultspec-core vaultspec-core-mcp; do
            target=$(readlink -f "$(command -v "${command}")")
            if xattr "${target}" 2>/dev/null | grep -q com.apple.quarantine; then
              echo "::error::${target} carries com.apple.quarantine; Homebrew is no longer the path that avoids Gatekeeper"
              quarantined=1
            fi
          done
          [ "${quarantined}" -eq 0 ] || exit 1
          echo "confirmed: no com.apple.quarantine on either executable"

      # A COLD START in a home directory nothing has written, then real work.
      # `--version` can be answered without importing much; `install` and
      # `vault check` pull the dependency closure the binary carries.
      - name: Use it the way a new user would
        run: |
          set -eux
          export HOME="${RUNNER_TEMP}/brew-home"
          proj="${RUNNER_TEMP}/brew-proj"
          rm -rf "$HOME" "${proj}"
          mkdir -p "$HOME" "${proj}"

          vaultspec-core --version

          cd "${proj}"
          git init -q
          git config user.email acquisition@example.invalid
          git config user.name "Acquisition Check"

          vaultspec-core install
          [ -d .vault ] || { echo "::error::install exited zero but scaffolded no .vault/"; exit 1; }
          vaultspec-core vault check all

      # The formula's own test block, which nothing else in this repository
      # runs. It asserts the installed binary reports the version the formula
      # claims, so a pointer generated against the wrong release fails here.
      - name: The formula's test block passes
        run: brew test vaultspec-core

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/brew" "${RUNNER_TEMP}/brew-home" "${RUNNER_TEMP}/brew-proj" || true

  acquire-windows:
    timeout-minutes: 60
    name: "Test: Release acquisition (Windows)"
    # NATIVE, like the macOS leg and for the same reason: the container on the
    # Linux legs exists to supply an OLDER libc than the build host, and Windows
    # has no equivalent knob. What this adds is that the artifact is EXECUTED.
    #
    # This closes the last platform in the matrix. Until now the Windows binary
    # was built, checksummed, pinned into the Scoop manifest and published with
    # nothing ever launching it - the same shape that let
    # `vaultspec-core-x86_64-apple-darwin` ship for several releases exiting 1.
    # Scoop is the channel most exposed to it: a manifest pins a digest, and a
    # correct digest for a binary that cannot start is exactly what the 0.1.60
    # empty-hash failure taught us to stop trusting on its own.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Acquire the published binary
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_TAG) { $env:EVENT_TAG } elseif ($env:INPUT_TAG) { $env:INPUT_TAG } else { '' }
          if (-not $tag) {
            $latest = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/releases/latest"
            $tag = $latest.tag_name
          }
          if (-not $tag) { Write-Error '::error::could not resolve a release tag'; exit 1 }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Its own directory, not the shared work tree. A reused self-hosted
          # checkout is the warm state this check exists to avoid, and this
          # runner is long-lived.
          $acq = Join-Path $env:RUNNER_TEMP 'acq'
          Remove-Item -Recurse -Force $acq -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $acq | Out-Null
          "ACQ=$acq" | Out-File -FilePath $env:GITHUB_ENV -Append

          $version = $tag.Substring('vaultspec-core-v'.Length)
          $archive = "vaultspec-core-v$version-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/$env:REPO/releases/download/$tag/$archive"
          $archivePath = Join-Path $acq $archive
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $acq -Force

          # Windows marks a downloaded file with a Zone.Identifier stream, which
          # is what a user gets from a browser too. Scoop clears it for them.
          # Strip it so this leg tests the binary rather than the mark.
          Unblock-File -Path (Join-Path $acq 'vaultspec-core.exe')

      # A COLD START, once, with no retry, and the retry's absence is the
      # assertion rather than a tidy-up.
      #
      # This step used to loop for ten minutes. The binary bootstrapped its
      # application from PyPI at first launch, so a freshly tagged release was
      # not resolvable until publish.yml had propagated to the CDN edge this
      # machine reads: v0.1.67 failed three legs of four on exactly that, and
      # the fourth passed only because it happened to be scheduled a minute
      # later. The loop waited that race out, and #386 established that
      # waiting on the binary itself was the only honest way to observe it.
      #
      # The binary now carries its application and its whole dependency
      # closure, so there is nothing left to propagate and nothing to wait
      # for. Keeping the loop would be worse than redundant: it would turn
      # "this artifact still reaches for the network" into a slow pass, and a
      # real failure into a ten-minute one whose message blames an index the
      # artifact no longer consults. A single cold start that must succeed is
      # now the stronger check, because the property being observed changed.
      #
      # The probe gets its OWN home so a warm cache left by an earlier job on
      # this machine cannot make a broken release look acquirable.
      #
      # The probe's home is a full profile rather than a bare directory -
      # shaped the way #383 established, because the platform API does not
      # accept a bare directory as one.
      - name: The published binary starts on a machine that has never run it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'bootstrap-probe'
          Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $probe 'AppData\Local'), (Join-Path $probe 'AppData\Roaming') | Out-Null
          # The environment is RESTORED afterwards: this runner is self-hosted
          # and its process environment is inherited by later steps.
          $saved = @{ USERPROFILE = $env:USERPROFILE; HOME = $env:HOME; APPDATA = $env:APPDATA; LOCALAPPDATA = $env:LOCALAPPDATA }
          $env:USERPROFILE = $probe
          $env:HOME = $probe
          $env:APPDATA = Join-Path $probe 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $probe 'AppData\Local'
          $exe = Join-Path $env:ACQ 'vaultspec-core.exe'
          & $exe --version
          $code = $LASTEXITCODE
          foreach ($k in $saved.Keys) { Set-Item -Path "env:$k" -Value $saved[$k] }
          if ($code -ne 0) {
            Write-Output "::error::the published binary did not start on a machine that has never run it"
            exit 1
          }

      - name: Use it the way a new user would
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A user's machine has none of this job's state.
          $home_ = Join-Path $env:RUNNER_TEMP 'fresh-home'
          $proj  = Join-Path $env:RUNNER_TEMP 'proj'
          Remove-Item -Recurse -Force $home_, $proj -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $home_, $proj | Out-Null
          $env:USERPROFILE = $home_
          $env:HOME = $home_
          # PyApp resolves its data directory from APPDATA/LOCALAPPDATA on
          # Windows, NOT from USERPROFILE. Redirecting only the latter left it
          # with no usable path, so the binary died on `unable to find platform
          # directories` and this leg failed EVERY release while the artifact
          # was perfectly good - measured against the published v0.1.68 exe:
          # USERPROFILE+HOME alone exits 1 with that error; adding these two
          # exits 0 and prints the version.
          $env:APPDATA = Join-Path $home_ 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $home_ 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null

          $exe = Join-Path $env:ACQ 'vaultspec-core.exe'

          # THE ASSERTION THIS LEG EXISTS FOR: it starts.
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::--version exited $LASTEXITCODE"; exit 1 }

          Set-Location $proj
          git init -q
          git config user.email acquisition@example.invalid
          git config user.name "Acquisition Check"

          & $exe install
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::install exited $LASTEXITCODE"; exit 1 }

          # Behaviour, not exit codes.
          if (-not (Test-Path '.vault')) {
            Write-Error '::error::install exited zero but scaffolded no .vault/'
            exit 1
          }
          & $exe vault check all
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::vault check all exited $LASTEXITCODE"; exit 1 }

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force `
            (Join-Path $env:RUNNER_TEMP 'acq'), `
            (Join-Path $env:RUNNER_TEMP 'fresh-home'), `
            (Join-Path $env:RUNNER_TEMP 'proj') -ErrorAction SilentlyContinue
