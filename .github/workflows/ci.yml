name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "uv cache mode for controlled CI measurement"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - cold

permissions:
  contents: read

concurrency:
  # Superseding a run is right on a branch and wrong on the default one.
  #
  # `main` here takes direct pushes, and required status checks gate pull
  # request merges only - so for a direct push the push-triggered run IS the
  # gate. Cancelling it destroys that gate, and a cancelled run reports as
  # `cancelled`, not `failed`: it is not red in the Actions list and nothing
  # downstream reacts to it. A quarter of this branch's history had carried no
  # verdict at all for that reason.
  #
  # `cancel-in-progress: false` was the first attempt and it is not enough,
  # because it governs only a run that has STARTED. GitHub's other concurrency
  # rule has no switch: when a run enters an occupied group, any previously
  # PENDING run in that group is cancelled outright. On this fleet - one Linux
  # runner and one Windows runner, shared with every other repository - a main
  # run routinely waits without starting, so it sits pending, and the next push
  # to main kills it. The merge that landed the check-set rework was cancelled
  # exactly this way: forty-four minutes queued, not one job ever assigned.
  #
  # The group therefore carries the SHA on main, so two main commits are never
  # in the same group and can never supersede one another. Every other ref
  # keeps one group per branch, where an in-flight run really is obsolete once
  # a newer commit arrives - and keeps cancelling, which is what stops branch
  # pushes from consuming the fleet the default branch is queueing for.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"

jobs:
  # The fleet has one Linux runner and one Windows runner. Keep every Linux
  # validation in one provisioned job so the runner pays for checkout, tool
  # setup, and `just init` only once. The individual gates retain their own
  # steps and always conditions, so a red gate does not hide later diagnostics.
  full-suite-linux:
    name: Full Suite (Linux)
    timeout-minutes: 120
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Isolate the cold uv cache
        if: inputs.cache_mode == 'cold'
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/vaultspec-core-uv-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # This persistent runner's native uv cache is the hot path. A
          # same-SHA cold run proved that transferring the multi-GB Actions
          # cache increased occupied time, so cloud restore/save stays off.
          enable-cache: false

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # These are separate gates so the merge box says which validation
      # dimension failed. Every gate is independent after provisioning: the
      # `always()` condition makes later diagnostics run after an earlier
      # failure, while an unhandled non-zero exit still fails this job.
      - name: The lockfile agrees with pyproject.toml
        if: always()
        run: just deps-check

      - name: Workflow lint and CI contract
        if: always()
        run: just check-workflow

      - name: Ruff
        if: always()
        run: just check-python

      - name: Ty (all target platforms)
        if: always()
        run: just check-type-platforms

      - name: Taplo
        if: always()
        run: just check-toml

      - name: Lychee
        if: always()
        run: just check-links

      - name: pymarkdown
        if: always()
        run: just check-markdown

      - name: Cognitive complexity
        if: always()
        run: just check-complexity

      - name: Nesting depth
        if: always()
        run: just check-nesting

      - name: Module and class size
        if: always()
        run: just check-size

      - name: Strict types
        if: always()
        run: just check-type-strict

      - name: Run development harness guards
        if: always()
        run: just test-harness

      - name: Run repository-health guards
        if: always()
        run: just test-repo

      - name: Run broad test suite
        if: always()
        run: just test-broad

      - name: Bootstrap framework
        if: always()
        run: just framework-install

      - name: Verify vault structure and links
        if: always()
        run: just vault-check

      - name: Python dependency vulnerability audit
        if: always()
        run: just audit-deps

  # The Windows leg is intentionally independent: it must start even when the
  # Linux validation job fails, and it has no matrix-generated suffix.
  library-windows:
    name: Library (Windows)
    timeout-minutes: 90
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Isolate the cold uv cache
        if: inputs.cache_mode == 'cold'
        shell: bash
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/vaultspec-core-uv-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ inputs.cache_mode != 'cold' }}

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        shell: bash
        run: just init

      - name: Run broad test suite
        shell: bash
        run: just test-broad
