name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"

jobs:
  # Every other job installs with --locked, so a lockfile that has drifted from
  # pyproject.toml fails all of them at once, inside "Install dependencies",
  # where the cause is easy to miss. This job isolates that one question and
  # answers it in seconds, so the drift reads as itself rather than as a
  # repository-wide outage.
  lockfile:
    name: Lockfile In Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify uv.lock matches pyproject.toml
        run: |
          if ! uv lock --locked; then
            echo "::error::uv.lock has drifted from pyproject.toml. Every job that installs with --locked will fail until this is fixed. Run 'uv lock' and commit the result."
            exit 1
          fi

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11

  lint-and-type:
    name: Lint, Type, Config, Link, and Markdown Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Ruff
        run: just lint python

      - name: Ty
        run: just lint type

      - name: Taplo
        run: just lint toml

      - name: Lychee
        run: just lint links

      - name: pymarkdown
        run: just lint markdown

      # Baseline-ratcheted gates. Each threshold sits at this tree's worst
      # current offender (see the census comments in pyproject.toml), so these
      # are green today and fail only on a NEW record-breaking offender. They
      # run after the cheap checks because they are the slow ones.
      #
      # `if: always()` on every gate below is deliberate. These steps
      # previously did not exist, and the failure mode they guard against is
      # real: a gate placed behind a red step never runs at all, so a
      # regression it would have caught reaches the default branch unseen. Each
      # gate must report its own verdict independently of its neighbours.
      - name: Cognitive complexity
        if: always()
        run: just lint complexity

      - name: Nesting depth
        if: always()
        run: just lint nesting

      - name: Module and class size
        if: always()
        run: just lint size

      # Strict typing's burndown reached zero, so this step is a real gate:
      # a regression fails the job like every other lint dimension here.
      - name: Strict types
        if: always()
        run: just lint type-strict

  code-health:
    name: Code Health (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      # Measurement only - every target exits 0. This is the instrument the
      # earlier health audits lacked: it ranks the worst offenders per
      # dimension so the ratchet has a target list rather than an intention.
      - name: Advisory audit dimensions
        run: just audit all

      - name: Code-health report
        run: just health fast

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Run tests
        run: just test unit

      - name: Run development harness guards
        run: just test harness

      # The repository-root tests/ tree holds the automation contracts and the
      # test-suite-quality guards. No CI lane named it until now, and the
      # doubles guard inside it had been failing unobserved as a result. A
      # guard nothing runs is not a guard.
      - name: Run repository automation and suite-quality guards
        run: just test repo

  broad-tests:
    name: broad (${{ matrix.os }})
    # The required "Tests" gate above is marker-scoped to `unit`, which hides the
    # much larger integration/behavioural suite. This job runs the full suite
    # (excluding only the gemini/claude markers, which need external API
    # credentials) on BOTH Linux and Windows, so a green CI no longer implies
    # "every test passed" when only the unit slice ran on a single OS - and so
    # platform-specific test hardcodes are caught automatically. Both hosted
    # runners are symlink-capable, so the symlink-requiring filesystem tests run
    # in full. This is a required status check on both legs: a failure on either
    # OS blocks the merge, so "green" means green on every platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        # bash is available on windows-latest via Git Bash; using it on both
        # OSes keeps the just invocation and argument quoting identical.
        shell: bash
        run: just deps sync

      - name: Run broad test suite
        shell: bash
        run: just test broad

  windows-vault-repair:
    name: Windows Vault Repair Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Run vault repair regression tests
        run: just test vault-repair

  vault-audit:
    name: Vault Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Bootstrap framework
        # The source repo tracks .vaultspec/ framework config, but the install
        # manifest (.vaultspec/providers.json) stays gitignored. A fresh
        # checkout therefore has the framework dir without a manifest, which
        # the diagnosis engine classifies as CORRUPTED. Run install with
        # --force to repair/create the manifest from the tracked config and
        # scaffold provider outputs, the way a consumer recovering a missing
        # manifest would.
        run: just framework install

      - name: Verify vault structure and links
        run: just vault check

  dependency-audit:
    name: Dependency Audit (uv audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Python dependency vulnerability audit
        run: just audit deps
