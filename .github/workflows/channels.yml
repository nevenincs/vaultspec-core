name: Core Channels

# The package-manager pointers, published AFTER the release they point at.
#
# A Scoop manifest and a Homebrew formula address assets by release download
# URL, so they are an advertisement for a release rather than a part of it.
# They used to be generated and pushed by the binaries lane, which was correct
# only while release-please published the release before anything was attached
# to it. It does not any more: the release is created as a draft and published
# at the end of publish.yml, and a pointer pushed before that flip sends
# `brew upgrade` and `scoop update` at a URL the draft does not serve.
#
# So this is its own lane, dispatched by publish.yml once the release is
# public. The rule it obeys is the one the acquisition check already moved
# for: nothing that advertises a release runs before the release exists.
#
# IT HOLDS THE DEPLOY KEY AND NOTHING ELSE. The obvious alternative was to
# append these steps to publish.yml, but that job carries `id-token: write`
# for PyPI trusted publishing, and that grant is not scoped to Sigstore - any
# step in a job that has it can mint an OIDC token for any audience it names.
# binaries.yml already separated those two capabilities once, moving
# attestation into a job that holds no key and runs no project code. Putting
# `CHANNEL_ROOT_DEPLOY_KEY` beside the token would have undone that, for the
# convenience of not writing this file.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to point the channels at (e.g. vaultspec-core-v0.2.3)"
        required: true
        type: string

permissions:
  contents: read

# Keyed by tag, like every other lane here. Two releases publishing at once
# must not have their pointer pushes cancel one another; the push itself
# rebases, but a cancelled run reports `cancelled` and nothing reacts to it.
concurrency:
  group: channels-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  channels:
    timeout-minutes: 30
    name: "Build: Release channel pointers (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      # Read only. The push does not go through the automatic token at all -
      # it goes to another repository over SSH with the deploy key below - so
      # this job never needs write access to anything here.
      contents: read
    steps:
      # This repo, for the generator. No credentials persisted: nothing is
      # pushed here.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main

      # ONE tap, ONE bucket, for every product under the account, so a user
      # taps or bucket-adds once ever rather than once per product. Homebrew's
      # one-argument tap form requires the `homebrew-` prefix; Scoop constrains
      # nothing, so a single repository satisfies both.
      - name: Checkout the distribution repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6  # zizmor: ignore[artipacked] pushes the channel pointers with the deploy key
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.13

      # FROM THE RELEASE, not from a build directory. The binaries lane used
      # its own `dist-bin/SHA256SUMS`, which is the same bytes it had just
      # uploaded - but "the same bytes" was an assumption about the upload
      # rather than a fact about the release. Read back from the published
      # release, the pointers describe what a user will actually download, and
      # a release missing its checksum manifest fails here instead of
      # producing a manifest for assets nobody can verify.
      - name: Download the published checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir published
          if [ ! -s published/SHA256SUMS ]; then
            echo "::error::${TAG} carries no SHA256SUMS; refusing to generate channel pointers for a release with nothing to verify against"
            exit 1
          fi

      # REFUSE A DRAFT. This lane exists because a pointer must not precede the
      # publication, so it checks that rather than trusting its caller: a
      # dispatch aimed at an unpublished release is the one mistake that
      # reintroduces the defect this file was written to remove.
      - name: Refuse to point at an unpublished release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "::error::${TAG} is still a draft. Its download URLs serve nothing, so a channel pointer published now would send every package manager at a 404."
            exit 1
          fi
          echo "${TAG} is published; its assets are downloadable"

      # Generated whole by dev/packaging rather than edited in place: the
      # generator raises on a missing digest, refuses a backward bump, and
      # omits an unbuilt platform instead of inventing one. The inline jq
      # rewrite this replaced guarded its lookups with `test -n "$A" && ...`,
      # which is inert under `set -e`, and v0.1.60 published a manifest with
      # empty hashes out of a green run.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- \
            python -m dev.packaging.generate \
              --tag "${TAG}" \
              --checksums published/SHA256SUMS \
              --root channels

      # Between generating the pointers and committing them, which is the only
      # point where a bad pointer can still be stopped rather than reported
      # afterwards.
      - name: Refuse an uninstallable channel pointer
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -m dev.packaging.validate --root channels

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd channels

          # Stage only THIS product's two files. The distribution repo serves
          # every product under the account, so `git add -- bucket Formula`
          # would sweep up a sibling's pointer if two releases raced, and
          # publish it under this tag's commit message.
          git add -- bucket/vaultspec-core.json Formula/vaultspec-core.rb

          # Compare the INDEX against HEAD, not the worktree. `git diff`
          # reports only tracked paths, so on the first release into a channel
          # - when these files are new and nothing tracks them yet - it reports
          # no change and this step exits zero having published nothing.
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi

          # Identity passed to this one commit rather than persisted. This
          # runner is self-hosted and its checkout is reused by later jobs, so
          # a `git config` identity outlives the run.
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): point scoop and homebrew at ${TAG}"

          # Rebase-and-retry. This branch is shared by every product under the
          # account, so the racing commit is a sibling product publishing its
          # own pointer. Per-product staging above means such a rebase never
          # carries someone else's file, and the generator's backward-bump
          # refusal still stops a stale re-run from clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
