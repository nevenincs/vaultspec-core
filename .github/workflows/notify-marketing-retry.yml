name: Core Notify Marketing Retry

# Core Notify Marketing is the only path from a published release to the
# marketing site, and publish.yml dispatches it without waiting for the result.
# A run that failed or was cancelled - a job no runner took before its timeout,
# a dispatch the network dropped - left the site on the previous release with
# nothing red anywhere a person looks. This lane reruns it, and opens an issue
# when the last attempt fails too, because a failure that survives two reruns
# is not transient.
#
# A rerun repeats the run with its original tag, and the signal is idempotent:
# marketing refreshes from the releases themselves, so a second delivery of the
# same tag changes nothing.

on:
  workflow_run:
    workflows: ["Core Notify Marketing"]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    name: "Build: Retry marketing notification (Linux)"
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 125
    env:
      CI_EXEC_BUDGET_MINUTES: 5
    permissions:
      actions: write
      issues: write
    steps:
      - name: Rerun the marketing notification
        if: ${{ github.event.workflow_run.run_attempt < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"

      - name: Report the undelivered marketing notification
        if: ${{ github.event.workflow_run.run_attempt >= 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >-
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "${RUN_TITLE} did not reach marketing"
          --body "Three attempts failed, the last at ${RUN_URL}. The marketing site
          still shows the previous release. Fix the cause, then run Core Notify
          Marketing for this tag."
