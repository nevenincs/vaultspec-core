name: Bootstrap Feature Branch

on:
  issues:
    types: [opened, closed, reopened, edited]

permissions:
  issues: write
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, dev-runner]
    # Disabled (see issue #326): no registered runner carries the
    # "dev-runner" label, so this job used to queue forever instead of
    # running, growing an unbounded backlog on every issue event. Skip it
    # here - before a runner is queued - rather than let it queue and hang.
    # Re-enable by dropping the "false &&" once a runner carries the
    # "dev-runner" label (or runs-on is repointed at the runner that hosts
    # /usr/local/bin/bootstrap.sh) and remove this comment.
    if: >-
      false &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null ||
      github.event.changes.body != null)
    concurrency:
      group: bootstrap-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Bootstrap local worktree
        # SECURITY: All issue data passed via env vars, NOT ${{ }} interpolation
        # in run blocks. Direct interpolation allows script injection via issue
        # titles containing shell metacharacters.
        env:
          GITHUB_TOKEN: ${{ secrets.DEV_RUNNER_PAT }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          /usr/local/bin/bootstrap.sh \
            --action "$ISSUE_ACTION" \
            --repo "$ISSUE_REPO" \
            --issue "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY"
