# vaultspec-commit-gate: the hook vaultspec-core scaffolds. One read-only
# process checks the staged vault documents and blocks staged per-machine
# files. It blocks only on errors the commit introduces.
#
# The workspace doctor is not a commit hook. It diagnoses the machine and
# the workspace, not the commit, so it would block commits on state they
# neither caused nor can fix. Run 'vaultspec-core spec doctor' explicitly
# or in CI.

- id: vaultspec-commit-gate
  name: Vaultspec commit gate
  entry: uv run --no-sync vaultspec-core commit-gate
  language: system
  always_run: true
  pass_filenames: true

# Whole-vault hooks, kept for projects that reference them by id. Each one
# scans the entire vault on every commit; prefer vaultspec-commit-gate.
#
# vault-fix: runs all vault checkers as a pure gate, reporting naming,
# frontmatter, link, dangling, reference, and body-link findings and
# blocking the commit on them. It does NOT repair: run
# 'vaultspec-core vault check all --fix' deliberately and commit its
# effects visibly. Schema migrations are owned by the
# vaultspec_core.migrations registry; use 'vaultspec-core migrations
# status' / 'migrations run' for explicit control.

- id: vault-fix
  name: Vault gate
  entry: uv run --no-sync vaultspec-core vault check all
  language: system
  types: [markdown]
  pass_filenames: false

- id: check-provider-artifacts
  name: Check provider artifacts
  entry: uv run --no-sync vaultspec-core check-providers
  language: system
  always_run: true
  pass_filenames: false

# Granular hooks for consumer projects that need fine-grained control.
# Each fix-* hook auto-repairs its domain; check-* hooks validate only.

- id: fix-naming
  name: Fix vault naming
  entry: uv run --no-sync vaultspec-core vault check structure --fix
  language: system
  types: [markdown]
  pass_filenames: false

- id: fix-frontmatter
